name: arsitek
description: "RuangRancang - aplikasi konsultasi desain rumah."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^6.10.0
  cupertino_icons: ^2.0.0
  file_selector: ^1.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - lib/images/
    - lib/images/arsitek/